[package]
name = "agent-password"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"

[dependencies]
anyhow = "1.0.100"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6.0.0"
getrandom = "0.2.15"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rpassword = "7"

[dev-dependencies]
tempfile = "3.20.0"
