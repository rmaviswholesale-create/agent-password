[package]
name = "agent-password"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"

[dependencies]
anyhow = "1.0.100"
block2 = "0.6.2"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6.0.0"
getrandom = "0.2.15"
libc = "0.2.180"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.20.0"
